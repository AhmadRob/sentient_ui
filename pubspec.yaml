name: sentient_ui
description: "A Flutter package for emotion-aware adaptive user interfaces with on-device emotion detection and real-time UI adaptation."
version: 0.1.2
homepage: https://github.com/AhmadRob/sentient_ui
repository: https://github.com/AhmadRob/sentient_ui.git
issue_tracker: https://github.com/AhmadRob/sentient_ui/issues
documentation: https://ahmadrob.github.io/sentient_ui/docs.html

topics:
  - emotion-detection
  - adaptive-ui
  - tflite
  - machine-learning
  - accessibility

screenshots:
  - description: 'Emotion-aware UI adapting between different emotional states'
    path: doc/assets/demo.gif

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  camera: ^0.11.0
  image: ^4.2.2
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  encrypt: ^5.0.3
  path_provider: ^2.1.1
  permission_handler: ^11.3.1
  battery_plus: ^6.0.0
  connectivity_plus: ^6.0.0
  sensors_plus: ^6.0.0
  noise_meter: ^5.0.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  assets:
    - assets/models/emotion_model.tflite
    - assets/models/emotion_labels.txt
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
